<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта проблем Житомира</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-container" class="welcome-overlay">
        <div class="welcome-card">
            <div class="icon-wrapper">
                <img src="Image.png" alt="📍" class="icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1201/1201138.png'">
            </div>
            
            <h1 class="welcome-title">Мапа проблем Житомира</h1>
            <p class="welcome-subtitle">Допоможіть зробити наше місто кращим!</p>
            
            <div class="chart-container" style="display: none;">
                <canvas id="welcomeChart"></canvas>
            </div>
            
            <ul class="features-list">
                <li><span class="emoji">📍</span> <span>Вкажіть місце на карті</span></li>
                <li><span class="emoji">📝</span> <span>Опишіть суть проблеми</span></li>
                <li><span class="emoji">✅</span> <span>Слідкуйте за її статусом</span></li>
            </ul>

            <div class="action-group">
                <button id="map-link" class="btn-primary">🗺️ Відкрити карту</button>
                <button id="list-link" class="btn-secondary">📋 Список заявок</button>
            </div>
            
            <div class="auth-buttons" style="margin-top: 15px;">
                <button id="user-auth-btn" class="btn-admin-text" style="color: #2980b9;">👤 Увійти / Зареєструватись</button>
                <button id="user-logout-btn" class="btn-admin-text" style="display:none; color: #e74c3c;">🚪 Вийти</button>
            </div>
        </div>
    </div>

    <div id="login-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2 style="margin-top:0;">Авторизація</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Увійдіть або створіть акаунт, щоб залишати мітки на карті.</p>
            
            <input type="email" id="auth-email" placeholder="Email" class="auth-input">
            <input type="password" id="auth-pass" placeholder="Пароль (мінімум 6 символів)" class="auth-input">
            
            <p id="auth-error" style="color:red; font-size:13px; display:none;"></p>
            
            <div class="action-group" style="margin-bottom:0; flex-wrap: wrap; gap: 10px;">
                <button id="btn-login-submit" class="btn-primary" style="flex: 1;">Увійти</button>
                <button id="btn-register-submit" class="btn-primary" style="flex: 1; background-color: #27ae60;">Реєстрація</button>
                <button id="btn-auth-cancel" class="btn-secondary" style="width: 100%;">Скасувати</button>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <button id="map-back-btn" class="floating-back-btn">⬅ Назад в меню</button>

    <div id="list-view" style="display:none;">
        <div class="list-header">
            <h2>Список проблем</h2>
            <select id="sort-select" class="sort-dropdown">
                <option value="newest">Спочатку нові</option>
                <option value="category">По категорії</option>
            </select>
            <button id="list-back-btn" class="back-btn">⬅ Назад в меню</button>
        </div>

        <div class="dashboard">
            <div class="stat-card"><span class="stat-value" id="total-count">0</span><span class="stat-label">Всього</span></div>
            <div class="stat-card urgent"><span class="stat-value" id="new-count">0</span><span class="stat-label">Нові</span></div>
            <div class="stat-card success"><span class="stat-value" id="resolved-count">0</span><span class="stat-label">Вирішено</span></div>
        </div>
        <ul id="issues-list"></ul>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
