<div id="toast" class="toast"></div>

<div id="confirm-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h2 id="confirm-title">Підтвердження</h2>
        <p id="confirm-desc" class="modal-desc">Ви впевнені?</p>

        <div class="action-group">
            <button id="btn-confirm-yes" class="btn-primary danger">Так, підтвердити</button>
            <button id="btn-confirm-no" class="btn-secondary">Скасувати</button>
        </div>
    </div>
</div>

<div id="login-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <span class="section-eyebrow">Кабінет мешканця</span>
        <h2 id="auth-modal-title">Авторизація</h2>
        <p id="auth-modal-desc">Вхід до особистого кабінету мешканця.</p>

        <input type="email" id="auth-email" placeholder="Електронна пошта" class="auth-input" autocomplete="email">
        <input type="password" id="auth-pass" placeholder="Пароль - мінімум 6 символів" class="auth-input" autocomplete="current-password">

        <p id="auth-error"></p>

        <div class="action-group">
            <button id="btn-auth-submit" class="btn-primary">Увійти</button>
            <button id="btn-auth-cancel" class="btn-secondary">Скасувати</button>
        </div>

        <div class="auth-toggle">
            <span id="auth-toggle-text">Немає облікового запису?</span>
            <a href="#" id="auth-toggle-link">Зареєструватися</a>
        </div>
    </div>
</div>
